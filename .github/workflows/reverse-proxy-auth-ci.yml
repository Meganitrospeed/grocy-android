name: Reverse proxy authentication CI

on:
  push:
    branches:
      - feature/reverse-proxy-web-auth

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug
